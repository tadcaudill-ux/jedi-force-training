    <style>
        :root {
            --jedi-blue: #00f0ff;
            --jedi-glow: rgba(0, 240, 255, 0.4);
            --datapad-bg: #0c0f12;
            --panel-bg: #151a21;
            --grime-color: #242c37;

            --jedi-glow: var(--imperial-glow);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--datapad-bg);
            color: var(--text-main);
            font-family: 'Courier New', Courier, monospace;
            padding: 10px;
            background-image: 
                linear-gradient(rgba(12, 15, 18, 0.95), rgba(12, 15, 18, 0.95)),
                radial-gradient(circle at 20% 30%, #1e2530 1px, transparent 1px),
                radial-gradient(circle at 75% 60%, #1e2530 2px, transparent 2px);
            background-size: 100% 100%, 20px 20px, 30px 30px;
            font-size: 18px;
        }

        .datapad-container {
            max-width: 100%;
            margin: 0 auto;
            border: 3px solid #3a4659;
            border-radius: 12px;
            background: var(--panel-bg);
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8), 0 0 15px rgba(0,0,0,0.5);
            position: relative;
            overflow: hidden;
        }

        .datapad-header {
            background: #1c232e;
            padding: 15px;
            border-bottom: 3px solid var(--jedi-blue);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .hud-title {
            color: var(--jedi-blue);
            text-transform: uppercase;
            font-weight: bold;
            letter-spacing: 1px;
            text-shadow: 0 0 8px var(--jedi-glow);
            font-size: 20px;
        }

        .rank-badge {
            font-size: 14px;
            background: #0c0f12;
            padding: 6px 10px;
            border: 1px solid var(--jedi-blue);
            border-radius: 4px;
            color: var(--jedi-blue);
            font-weight: bold;
        }

        .panel {

        }

        .auth-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #0e1217;
            padding: 12px 15px;
            font-size: 13px;
            border-bottom: 1px dashed #3a4659;
        }

        .btn-jedi {
            background: #1c232e;
            color: var(--jedi-blue);
            border: 1px solid var(--jedi-blue);
            padding: 12px 18px; /* Large mobile thumb friendly target */
            font-family: inherit;
            cursor: pointer;
            text-transform: uppercase;
            font-size: 14px;
            transition: all 0.2s ease;
            font-weight: bold;
            border-radius: 6px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            background: #0e1217;
            padding: 12px;
            border-radius: 6px;
        }

        .stat-val {
            font-size: 26px;
            color: var(--jedi-blue);
            font-weight: bold;
        }

        .stat-lbl { font-size: 12px; color: #788ba6; text-transform: uppercase; }

        .workout-nav {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding: 10px 0;
            -webkit-overflow-scrolling: touch;
            width: 100%;
        }
        
        .nav-tab {
            background: #10141a;
            border: 1px solid #2d3745;
            color: #788ba6;
            padding: 12px 18px;
            font-size: 14px;
            white-space: nowrap;
            cursor: pointer;
            text-transform: uppercase;
            font-weight: bold;
            flex-shrink: 0;
            border-radius: 4px;
        }
        .nav-tab.active {
            border-color: var(--jedi-blue);
            color: var(--jedi-blue);
            background: #1c232e;
        }

        .exercise-card {
            background: #11161d;
            border-left: 5px solid var(--jedi-blue);
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 6px;
        }
        .exercise-title {
            font-size: 16px;
            color: var(--jedi-blue);
            margin-bottom: 12px;
            text-transform: uppercase;
            font-weight: bold;
        }

        /* Mobile Rep Grid Redesign */
        .set-row {
            display: grid;
            grid-template-columns: 55px 1fr 1fr;
            gap: 10px;
            align-items: center;
            margin-bottom: 10px;
        }
        .set-label { font-size: 13px; color: #788ba6; font-weight: bold; }
        
        /* Tactical Big Input Fields */
        input[type="number"], input[type="text"] {
            background: #07090c;
            border: 1px solid #3a4659;
            color: #fff;
            padding: 12px 5px; /* Huge vertical touch zone */
            font-family: inherit;
            text-align: center;
            border-radius: 6px;
            font-size: 18px; /* Stops iOS from auto-zooming screen structure */
            width: 100%;

            outline: none;

        .timer-container {
            background: #090c10;
            border: 1px solid var(--jedi-blue);

            text-align: center;
            margin-top: 10px;
        }
        .timer-display {
            font-size: 40px;
            color: var(--jedi-blue);
            font-weight: bold;
            margin-bottom: 8px;
        }

        #yt-player-container { display: none; }
    </style>
</head>

    window.addEventListener('DOMContentLoaded', () => {
        loadLocalState();
        generateNavigationTabs();
        renderWorkspace();
        initGoogleAuthInfrastructure();
        initYouTubePlayerEngine();
    });

    function wakeAudioEngine() {
        if (!audioContextWoken) {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            audioCtx.resume().then(() => { audioContextWoken = true; });
        }
    }

    function loadLocalState() {
        const data = localStorage.getItem('jedi_datapad_state');
        if (data) { appState = JSON.parse(data); updateDashboardMetrics(); }
    }

    function saveLocalStorageState() {
        localStorage.setItem('jedi_datapad_state', JSON.stringify(appState));
        updateDashboardMetrics();
    }

    function updateDashboardMetrics() {
        document.getElementById('streak-count').innerText = appState.streak || 0;
        document.getElementById('total-logs').innerText = appState.totalWorkouts || 0;
        let rank = "INITIATE";
        const total = appState.totalWorkouts || 0;
        if (total > 250) rank = "MASTER";
        else if (total > 80) rank = "KNIGHT";
        else if (total > 20) rank = "PADAWAN";
        document.getElementById('jedi-rank').innerText = rank;
    }

    function generateNavigationTabs() {
        const tabContainer = document.getElementById('workout-tabs');
        tabContainer.innerHTML = ''; 
        Object.keys(routines).forEach(key => {
            let dayId = parseInt(key);
            let tab = document.createElement('div');
            tab.className = `nav-tab ${activeDay === dayId ? 'active' : ''}`;
            tab.innerText = dayId === 0 ? "Meditation" : (dayId === 5 ? "⚠️ ORDER 66" : `Day ${dayId}`);
            tab.onclick = (e) => {
                document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
                e.target.classList.add('active');
                switchWorkout(dayId);
            };
            tabContainer.appendChild(tab);
        });
    }

    function switchWorkout(dayNum) { activeDay = dayNum; renderWorkspace(); triggerAudioCue('beep'); }

    function renderWorkspace() {
        const workspace = document.getElementById('exercise-workspace');
        const config = routines[activeDay];
        
        if(config.isOrder66) {
            document.body.classList.add('order-66');
            document.getElementById('app-title').innerText = "PROTOCOL 66";
            timerSeconds = 66; updateTimerDisplay();
        } else {
            document.body.classList.remove('order-66');
            document.getElementById('app-title').innerText = "Jedi Holocron";
        }

        workspace.innerHTML = `<h3 style="color:var(--jedi-blue); margin-bottom:12px; font-size:16px; text-transform:uppercase;">${config.name}</h3>`;

        if(config.isMeditation) {
            workspace.innerHTML += `
                <div style="text-align:center; padding:15px 0;">
                    <p style="font-size:15px; margin-bottom:15px; color:#788ba6;">Align your connection to the Force.</p>
                    <button class="btn-jedi" onclick="setupMeditationSession()">Begin 30m Meditation</button>
                </div>`;
            return;
        }

        config.exercises.forEach(ex => {
            let card = document.createElement('div');
            card.className = 'exercise-card';
            card.innerHTML = `
                <div class="exercise-title">${ex.name} <span style="font-size:12px; color:#566985; font-weight:normal;">(${ex.targetReps})</span></div>
                <div class="set-row" style="border-bottom:1px solid #1c232e; padding-bottom:4px; margin-bottom:8px;">
                    <div class="set-label">SET</div>
                    <div class="set-label">LBS</div>
                    <div class="set-label">REPS</div>
                </div>`;

            for (let s = 1; s <= ex.sets; s++) {
                let setRow = document.createElement('div');
                setRow.className = 'set-row';
                const isLocked = config.isOrder66;
                // Optimized numeric patterns for phone virtual layout keyboards
                const repVal = isLocked ? 'value="6" readonly style="color:var(--imperial-red);"' : 'placeholder="0" inputmode="numeric" pattern="[0-9]*"';
                
                setRow.innerHTML = `
                    <div class="set-label">#0${s}</div>
                    <input type="number" id="${ex.id}_w_${s}" class="weight-input" data-exercise="${ex.id}" data-set="${s}" placeholder="0" inputmode="numeric" pattern="[0-9]*">
                    <input type="number" id="${ex.id}_r_${s}" class="rep-input" data-exercise="${ex.id}" data-set="${s}" ${repVal}>`;
                card.appendChild(setRow);
            }
            workspace.appendChild(card);
        });
        attachAutofillListeners(config.isOrder66);
    }

    function attachAutofillListeners(isOrder66Locked) {
        document.querySelectorAll('.weight-input').forEach(input => {
            input.addEventListener('input', (e) => {
                if (parseInt(e.target.dataset.set) === 1) {
                    const exId = e.target.dataset.exercise;
                    document.querySelectorAll(`.weight-input[data-exercise="${exId}"]`).forEach(child => {
                        if (parseInt(child.dataset.set) > 1) child.value = e.target.value;
                    });
                }
            });
        });
        if (!isOrder66Locked) {
            document.querySelectorAll('.rep-input').forEach(input => {
                input.addEventListener('input', (e) => {
                    if (parseInt(e.target.dataset.set) === 1) {
                        const exId = e.target.dataset.exercise;
                        document.querySelectorAll(`.rep-input[data-exercise="${exId}"]`).forEach(child => {
                            if (parseInt(child.dataset.set) > 1) child.value = e.target.value;
                        });
                    }
                });
            });
        }
    }

    function triggerAudioCue(type) {
        if (!audioContextWoken) return;
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        osc.connect(gainNode); gainNode.connect(audioCtx.destination);
        if (type === 'click') {
            osc.frequency.setValueAtTime(880, audioCtx.currentTime); gainNode.gain.setValueAtTime(0.03, audioCtx.currentTime);
            osc.start(); osc.stop(audioCtx.currentTime + 0.05);
        } else if (type === 'beep') {
            osc.type = 'triangle'; osc.frequency.setValueAtTime(440, audioCtx.currentTime); gainNode.gain.setValueAtTime(0.03, audioCtx.currentTime);
            osc.start(); osc.stop(audioCtx.currentTime + 0.1);
        } else if (type === 'alarm') {
            osc.type = 'sawtooth'; osc.frequency.setValueAtTime(120, audioCtx.currentTime); gainNode.gain.setValueAtTime(0.08, audioCtx.currentTime);
            osc.start(); osc.stop(audioCtx.currentTime + 0.6);
        }
    }

    function initYouTubePlayerEngine() {
        var tag = document.createElement('script'); tag.src = "https://www.youtube.com/iframe_api";
        document.getElementsByTagName('script')[0].parentNode.insertBefore(tag, document.getElementsByTagName('script')[0]);
    }

    function onYouTubeIframeAPIReady() {
        ytPlayer = new YT.Player('inline-audio-node', { height: '0', width: '0', videoId: 'HqqV-Vf_kXU' });
    }

    function setupMeditationSession() {
        timerSeconds = 1800; updateTimerDisplay();
        if(ytPlayer && ytPlayer.loadVideoById) { ytPlayer.loadVideoById('wS8WFr_N_I4'); ytPlayer.playVideo(); }
    }

    function startTimer() {
        clearInterval(countdownInterval); triggerAudioCue('click');
        countdownInterval = setInterval(() => {
            if (timerSeconds > 0) { timerSeconds--; updateTimerDisplay(); if (timerSeconds === 0) handleTimerExpiry(); } 
            else { clearInterval(countdownInterval); }
        }, 1000);
    }

    function resetTimer() {
        clearInterval(countdownInterval); timerSeconds = routines[activeDay].isOrder66 ? 66 : 0; updateTimerDisplay();
        if(ytPlayer && ytPlayer.stopVideo) ytPlayer.stopVideo();
    }

    function updateTimerDisplay() {
        let min = Math.floor(timerSeconds / 60); let sec = timerSeconds % 60;
        document.getElementById('timer-time').innerText = `${min.toString().padStart(2, '0')}:${sec.toString().padStart(2, '0')}`;
    }

    function handleTimerExpiry() {
        clearInterval(countdownInterval);
        if (routines[activeDay].isOrder66) {
            triggerAudioCue('alarm');
            if(ytPlayer && ytPlayer.loadVideoById) { ytPlayer.loadVideoById('YBlVea9Bv0o'); ytPlayer.playVideo(); }
        } else { triggerAudioCue('beep'); }
    }

    function saveCurrentWorkout() {
        const todayStr = new Date().toDateString();
        if (appState.lastLoggedDate !== todayStr) { appState.streak = (appState.streak || 0) + 1; appState.lastLoggedDate = todayStr; }
        appState.totalWorkouts = (appState.totalWorkouts || 0) + 1;
        
        const entry = { date: new Date().toISOString(), day: activeDay, name: routines[activeDay].name, stats: {} };
        document.querySelectorAll('#exercise-workspace input').forEach(input => { entry.stats[input.id] = input.value; });
        appState.history.push(entry);
        saveLocalStorageState();
        triggerAudioCue('beep');
        pushToGoogleDriveHolocron();
        alert("Log committed successfully!");
    }

    function initGoogleAuthInfrastructure() {
        gapi.load('client', () => {
            gapi.client.init({ discoveryDocs: [DISCOVERY_DOC] }).then(() => { gapiInited = true; });
        });
        tokenClient = google.accounts.oauth2.initTokenClient({
            client_id: GOOGLE_CLIENT_ID, scope: SCOPES,
            callback: (resp) => {
                if (resp.error !== undefined) return;
                document.getElementById('sync-status').innerText = "DATAPAD SYNC: CONNECTED";
                document.getElementById('auth-btn').style.display = "none";
                initializeOrFetchDriveDatabase();
            },
        });
        gsiInited = true;
    }

    function handleAuthClick() {
        if (!gapiInited || !gsiInited) return;
        tokenClient.requestAccessToken({prompt: 'consent'});
    }

    async function initializeOrFetchDriveDatabase() {
        try {
            let response = await gapi.client.drive.files.list({ q: "name = 'jedi_force_training_manifest.json' and trashed = false", fields: 'files(id, name)' });
            let files = response.result.files;
            if (files && files.length > 0) {
                driveFileId = files[0].id;
                let fileData = await gapi.client.drive.files.get({ fileId: driveFileId, alt: 'media' });
                if (fileData.result && fileData.result.history) { appState = fileData.result; saveLocalStorageState(); }
            } else { createDriveDatabaseFile(); }
        } catch (err) { console.error("Sync disrupted", err); }
    }

    async function createDriveDatabaseFile() {
        const boundary = 'foo_bar_baz';
        const delimiter = "\r\n--" + boundary + "\r\n";
        const close_delim = "\r\n--" + boundary + "--";
        const metadata = { 'name': 'jedi_force_training_manifest.json', 'mimeType': 'application/json' };
        const multipartRequestBody = delimiter + 'Content-Type: application/json; charset=UTF-8\r\n\r\n' + JSON.stringify(metadata) + delimiter + 'Content-Type: application/json\r\n\r\n' + JSON.stringify(appState) + close_delim;
        
        gapi.client.request({
            'path': '/upload/drive/v3/files', 'method': 'POST',
            'params': {'uploadType': 'multipart'}, 'headers': { 'Content-Type': 'multipart/related; boundary="' + boundary + '"' },
            'body': multipartRequestBody
        }).execute(file => { if(file.id) driveFileId = file.id; });
    }

    async function pushToGoogleDriveHolocron() {
        if (!driveFileId) return; 
        gapi.client.request({ path: `/upload/drive/v3/files/${driveFileId}`, method: 'PATCH', params: { uploadType: 'media' }, body: JSON.stringify(appState) }).execute();
    }
</script>
